plugins {
    id 'com.android.application'
}

// 🔴 release 签名从 local.properties 读（该文件在 .gitignore 里，keystore 本身放在仓库外
//    H:/AI PG/FlipMirror-keys/）。以前 release 用的是 Android debug 证书，换机/重装后
//    升级链就断了（INSTALL_FAILED_UPDATE_INCOMPATIBLE）。
//    local.properties 缺这几项时自动回落到 debug 签名，保证别人克隆下来也能构建。
def localProps = new Properties()
def localPropsFile = rootProject.file('local.properties')
if (localPropsFile.exists()) {
    localPropsFile.withInputStream { localProps.load(it) }
}
def hasReleaseKey = localProps.getProperty('flip.keystore.file') != null

android {
    buildFeatures {
        aidl true
    }
    namespace 'com.flip.mirror'
    compileSdk 34

    defaultConfig {
        applicationId "com.flip.mirror"
        minSdk 34
        targetSdk 34
        versionCode 306
        versionName "2.2.8"
    }

    signingConfigs {
        release {
            if (hasReleaseKey) {
                storeFile file(localProps.getProperty('flip.keystore.file'))
                storePassword localProps.getProperty('flip.keystore.password')
                keyAlias localProps.getProperty('flip.keystore.alias')
                keyPassword localProps.getProperty('flip.keystore.password')
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig hasReleaseKey ? signingConfigs.release : signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    // 强制指定目标外屏所在 display
    // 隐藏 API 反射（device_state / injectInputEvent）会触发 lint Vital 报错，
    // 但那些调用是必要的且有 try/catch 兜底，release 不打 lint。
    lint {
        checkReleaseBuilds false
        abortOnError false
    }

    lintOptions {
        abortOnError false
    }
}

dependencies {
    // Shizuku：App 侧通过它拿到 shell 权限执行 input 命令（KernelSU 的 su 对 App 不可见）
    implementation 'dev.rikka.shizuku:api:13.1.5'
    implementation 'dev.rikka.shizuku:provider:13.1.5'
}
